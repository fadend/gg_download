<!doctype html>
<html>
  <head>
    <title>GG Download</title>
  </head>
  <body>
    Max to download: <input id="max-downloads" size="4" /><span
      style="float: right"
      id="message"
    ></span>
    <br />
    <button id="start-button">Start</button>
    <br />
    URLs found: <span id="url-count"></span>
    <br />
    <textarea id="urls" rows="3" cols="80"></textarea>
    <br />
    Downloaded: <span id="download-count"></span>
    <br />
    Failed: <span id="failed-count"></span>
    <br />
    <textarea id="failed-downloads" rows="3" cols="80"></textarea>
    <script src="scripts/popup.js"></script>
  </body>
</html>
